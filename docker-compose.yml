services:
  # TimescaleDB/PostgreSQL
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: sv_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-smart_vineyard}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Python FastAPI Backend
  backend:
    build: ./backend
    container_name: sv_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
    volumes:
      - ./backend:/app
      - /mnt/pve/hddStorage/greenhouse_data/images:/app/images
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana-oss:latest
    container_name: sv_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescaledb_data:
  grafana_data:
